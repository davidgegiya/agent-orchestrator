[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-orchestrator"
version = "0.4.0"
description = "OpenAI Agents SDK-based agent orchestration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai-agents>=0.23,<0.25",
  "openai>=3,<4",
  "pydantic>=2,<3",
  "filelock>=3,<4",
  "python-dotenv>=1.0.0",
]

[project.scripts]
agent-orchestrator = "orchestrator.main:main"
agent-orchestrator-bench = "orchestrator.benchmark.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
benchmark = ["pyarrow>=15"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestrator*"]
exclude = ["project*", "workspace*"]

[tool.setuptools.package-data]
orchestrator = ["prompts/*.md"]
